tag:
  - chain_of_thought
task: svamp_cot_manual
dataset_path: ChilleD/SVAMP
output_type: generate_until
test_split: test
doc_to_text: "Question: {{Body}} {{Question}}\nAnswer: Let's think step by step."
doc_to_target: "{{Answer}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: false
    regexes_to_ignore:
      - ","
      - "\\$"
      - "(?s).*#### "
      - "\\.$"
generation_kwargs:
  until:
    - "Q:"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
repeats: 1
num_fewshot: 0
filter_list:
  - name: "strict-match"
    filter:
      - function: "regex"
        regex_pattern: "The answer is ((-?[$0-9.,]{2,})|(-?[0-9]+))"
        group_select: -1
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "(-?[$0-9.,]{2,})|(-?[0-9]+)"
      - function: "take_first"
should_decontaminate: true
doc_to_decontamination_query: "{{Body}} {{Question}}"
metadata:
  version: 1.0
